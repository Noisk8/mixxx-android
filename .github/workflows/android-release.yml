name: Prepare verified Android release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build run containing android-release-arm64
        required: true
      qa_path:
        description: Committed physical QA JSON for the exact APK
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      QA_PATH: ${{ inputs.qa_path }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - name: Download the signed APK from this revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test "$TAG_NAME" = "android-v$(python3 -c 'import json; print(json.load(open("packaging/android/release.json"))["version"])')"
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.head_sha')
          run_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.conclusion')
          git merge-base --is-ancestor "$run_sha" HEAD
          git diff --quiet "$run_sha" HEAD -- . ':(exclude)packaging/android/qa/**'
          [[ "$QA_PATH" == packaging/android/qa/*.json ]]
          test "$run_status" = success
          gh run download "$BUILD_RUN_ID" --name android-release-arm64 --dir release
      - name: Verify signature, version, checksum and physical tests
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0'
          apk_name=$(python3 tools/android_release.py name)
          (cd release && sha256sum --check "$apk_name.sha256")
          python3 tools/android_release.py gate --apk "release/$apk_name" --sdk "$ANDROID_HOME" --qa "$QA_PATH"
      - name: Create the release draft for human review
        shell: bash
        run: |
          set -euo pipefail
          apk_name=$(python3 tools/android_release.py name)
          title=$(python3 -c 'import json; r=json.load(open("packaging/android/release.json")); print("Mixxx Android " + r["version"] + " — " + r["codename"])')
          python3 -c 'from pathlib import Path; Path("/tmp/release-notes.md").write_text("Autonomously generated by an AI agent.\n\nSigned Android APK with matching version, checksum, and human physical QA evidence attached. Review the test results and release notes before publishing.\n\nEnd of text autonomously generated by an AI agent.\n")'
          gh release create "$TAG_NAME" "release/$apk_name" "release/$apk_name.sha256" "$QA_PATH" \
            --verify-tag --draft --title "$title" --notes-file /tmp/release-notes.md
